name: Build and deploy tailwind app

on:
  push:
    branches:
      - development

jobs:
  build-deploy:
    name: Build and Deploy tailwind app
    runs-on: ubuntu-latest

    steps:
      - name: Chekout code
        uses: actions/checkout@v2

      - name: Set up Node.js
        uses: actions/setup-node@v3
        with:
          node-version: 18

      - name: Install Dependancies
        run: npm Install

      - name: Build the app
        run: npm run build
