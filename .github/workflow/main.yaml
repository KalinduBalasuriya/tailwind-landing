name: Build and Deploy tailwind app

on:
  push:
    branches:
      - development

jobs:
  build-deploy:
    name: Build and Deploy tailwind app
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v2

      - name: Set up Node.js
        uses: actions/setup-node@v3
        with:
          node-version: 18

      - name: Install Dependencies
        run: npm install

      - name: Build the app
        run: npm run build
