name: Testing pull request workflow

on:
  pull_request:
    branches:
      - main

jobs:
  testing-pull-request:
    name: testing-pull-request
    runs-on: windows-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: setup environment
        uses: actions/setup-node
        with:
          node-version: 20

      - name: Install dependancies
        run: npm install

      - name: Build App
        run: npm run build
